<svg class="sqk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Right-click a catalog in the Catalogs pane, open Color by… and pick an attribute such as rating: each event on the plots takes the colour of its value.">
<style>
.sqk { --win:#ffffff;--bar:#ebebed;--side:#f4f4f6;--line:#d5d5da;--fg:#2f2f33;--dim:#77777f;--accent:#3584e4;--accent-soft:#3584e422;--on-accent:#ffffff;--c1:#1c71d8;--c2:#e66100;--c3:#26a269;--c4:#9141ac;--shadow:#00000022; font-family: "Adwaita Sans", Inter, Cantarell, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { .sqk { --win:#27272b;--bar:#34343a;--side:#2e2e33;--line:#4a4a52;--fg:#f1f1f3;--dim:#a3a3ad;--accent:#78aeed;--accent-soft:#78aeed2e;--on-accent:#14141a;--c1:#78aeed;--c2:#ffa348;--c3:#57e389;--c4:#dc8add;--shadow:#00000066; } }
.sqk text { fill: var(--fg); font-size: 12px; }
.sqk .dim { fill: var(--dim); }
.sqk .small { font-size: 10.5px; }
.sqk .title { font-weight: 700; font-size: 12.5px; }
.sqk .step text { font-size: 12.5px; font-weight: 600; }
.sqk .a { animation-duration: 13s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.sqk .trace { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; vector-effect: non-scaling-stroke; }
/* A plain curve, for groups the animation stretches or cross-fades: the dash trick misbehaves there. */
.sqk .curve { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sqk .ring { transform-box: fill-box; transform-origin: center; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .sqk .a { animation: none; } }

/* Resting state = the result: every event coloured by its rating. */
.sqk .cursor { animation-name: sqk-cursor; opacity: 0; }
.sqk .menu { animation-name: sqk-menu; opacity: 0; }
.sqk .sub { animation-name: sqk-sub; opacity: 0; }
.sqk .key { animation-name: sqk-key; opacity: 0; }
.sqk .uniform { animation-name: sqk-uniform; opacity: 0; }
.sqk .ev0 { animation-name: sqk-ev0; }
.sqk .ev1 { animation-name: sqk-ev1; }
.sqk .ev2 { animation-name: sqk-ev2; }
.sqk .ev3 { animation-name: sqk-ev3; }
.sqk .ev4 { animation-name: sqk-ev4; }
.sqk .rc { animation-name: sqk-rc; }
.sqk .pick { animation-name: sqk-pick; }
.sqk .s1 { animation-name: sqk-s1; }
.sqk .s2 { animation-name: sqk-s2; }
.sqk .s3 { animation-name: sqk-s3; }
@keyframes sqk-cursor { 0.00% { transform: translate(600px, 300px);opacity: 1; } 4.62% { transform: translate(600px, 300px);opacity: 1; } 13.08% { transform: translate(150px, 131px);opacity: 1; } 20.00% { transform: translate(150px, 131px);opacity: 1; } 24.62% { transform: translate(216px, 242px);opacity: 1; } 32.31% { transform: translate(216px, 242px);opacity: 1; } 35.38% { transform: translate(368px, 242px);opacity: 1; } 40.77% { transform: translate(388px, 264px);opacity: 1; } 87.69% { transform: translate(388px, 264px);opacity: 1; } 100.00% { transform: translate(600px, 300px);opacity: 1; } }
@keyframes sqk-menu { 0.00% { opacity: 0; } 16.15% { opacity: 0; } 17.31% { opacity: 1; } 43.08% { opacity: 1; } 44.23% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-sub { 0.00% { opacity: 0; } 27.69% { opacity: 0; } 28.85% { opacity: 1; } 43.08% { opacity: 1; } 44.23% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-key { 0.00% { opacity: 0; } 12.31% { opacity: 0; } 13.85% { opacity: 1; } 19.23% { opacity: 1; } 20.77% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-uniform { 0.00% { opacity: 1; } 44.62% { opacity: 1; } 48.46% { opacity: 0; } 93.85% { opacity: 0; } 97.69% { opacity: 1; } 100.00% { opacity: 1; } }
@keyframes sqk-ev0 { 0.00% { opacity: 0; } 45.38% { opacity: 0; } 49.23% { opacity: 1; } 93.85% { opacity: 1; } 97.69% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-ev1 { 0.00% { opacity: 0; } 47.31% { opacity: 0; } 51.15% { opacity: 1; } 93.85% { opacity: 1; } 97.69% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-ev2 { 0.00% { opacity: 0; } 49.23% { opacity: 0; } 53.08% { opacity: 1; } 93.85% { opacity: 1; } 97.69% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-ev3 { 0.00% { opacity: 0; } 51.15% { opacity: 0; } 55.00% { opacity: 1; } 93.85% { opacity: 1; } 97.69% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-ev4 { 0.00% { opacity: 0; } 53.08% { opacity: 0; } 56.92% { opacity: 1; } 93.85% { opacity: 1; } 97.69% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqk-rc { 15.23% { transform: scale(.3); opacity: 0; } 15.38% { transform: scale(.3); opacity: .9; } 20.00% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqk-pick { 42.92% { transform: scale(.3); opacity: 0; } 43.08% { transform: scale(.3); opacity: .9; } 47.69% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqk-s1 { 0.00% { opacity: .4; } 4.62% { opacity: .4; } 6.92% { opacity: 1; } 23.85% { opacity: 1; } 26.15% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqk-s2 { 0.00% { opacity: .4; } 24.62% { opacity: .4; } 26.92% { opacity: 1; } 44.62% { opacity: 1; } 46.92% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqk-s3 { 0.00% { opacity: .4; } 45.38% { opacity: .4; } 47.69% { opacity: 1; } 90.77% { opacity: 1; } 93.08% { opacity: .4; } 100.00% { opacity: .4; } }
</style>
