@keyframes sqa-ghost { 0.00% { transform: translate(146px, 189px);opacity: 0; } 39.17% { transform: translate(146px, 189px);opacity: 0; } 40.00% { transform: translate(146px, 189px);opacity: 1; } 59.17% { transform: translate(470px, 212px);opacity: 1; } 60.83% { transform: translate(470px, 212px);opacity: 1; } 63.33% { transform: translate(470px, 212px);opacity: 0; } 100.00% { transform: translate(470px, 212px);opacity: 0; } }
@keyframes sqa-pane { 0.00% { transform: translate(-28px, 0px); opacity: 0; } 18.33% { transform: translate(-28px, 0px); opacity: 0; } 24.17% { transform: translate(0px, 0px); opacity: 1; } 95.00% { transform: translate(0px, 0px); opacity: 1; } 99.17% { transform: translate(-28px, 0px); opacity: 0; } 100.00% { transform: translate(-28px, 0px); opacity: 0; } }
@keyframes sqa-tab { 0.00% { opacity: 0; } 17.50% { opacity: 0; } 20.00% { opacity: 1; } 95.00% { opacity: 1; } 97.50% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqa-rowhot { 0.00% { opacity: 0; } 31.67% { opacity: 0; } 33.75% { opacity: 1; } 60.83% { opacity: 1; } 62.92% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqa-dzhot { 0.00% { opacity: 0; } 48.33% { opacity: 0; } 50.83% { opacity: 1; } 60.83% { opacity: 1; } 63.33% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqa-hint { 0.00% { opacity: 1; } 60.83% { opacity: 1; } 63.33% { opacity: 0; } 96.67% { opacity: 0; } 99.17% { opacity: 1; } 100.00% { opacity: 1; } }
@keyframes sqa-plot { 0.00% { opacity: 0; } 61.67% { opacity: 0; } 64.17% { opacity: 1; } 95.00% { opacity: 1; } 97.50% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqa-t0 { 0.00% { stroke-dashoffset: 1; } 63.33% { stroke-dashoffset: 1; } 77.50% { stroke-dashoffset: 0; } 100.00% { stroke-dashoffset: 0; } }
@keyframes sqa-t1 { 0.00% { stroke-dashoffset: 1; } 66.25% { stroke-dashoffset: 1; } 80.42% { stroke-dashoffset: 0; } 100.00% { stroke-dashoffset: 0; } }
@keyframes sqa-t2 { 0.00% { stroke-dashoffset: 1; } 69.17% { stroke-dashoffset: 1; } 83.33% { stroke-dashoffset: 0; } 100.00% { stroke-dashoffset: 0; } }
@keyframes sqa-open { 18.17% { transform: scale(.3); opacity: 0; } 18.33% { transform: scale(.3); opacity: .9; } 23.33% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqa-press { 38.17% { transform: scale(.3); opacity: 0; } 38.33% { transform: scale(.3); opacity: .9; } 43.33% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqa-release { 60.67% { transform: scale(.3); opacity: 0; } 60.83% { transform: scale(.3); opacity: .9; } 65.83% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqa-s1 { 0.00% { opacity: .4; } 4.17% { opacity: .4; } 6.67% { opacity: 1; } 26.67% { opacity: 1; } 29.17% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqa-s2 { 0.00% { opacity: .4; } 29.17% { opacity: .4; } 31.67% { opacity: 1; } 60.83% { opacity: 1; } 63.33% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqa-s3 { 0.00% { opacity: .4; } 63.33% { opacity: .4; } 65.83% { opacity: 1; } 92.50% { opacity: 1; } 95.00% { opacity: .4; } 100.00% { opacity: .4; } }
</style>
