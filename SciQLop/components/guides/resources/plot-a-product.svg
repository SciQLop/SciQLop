<svg class="sqa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Open the Products pane with its icon on the left edge, then drag a product onto a plot panel to plot it.">
<style>
.sqa { --win:#ffffff;--bar:#ebebed;--side:#f4f4f6;--line:#d5d5da;--fg:#2f2f33;--dim:#77777f;--accent:#3584e4;--accent-soft:#3584e422;--on-accent:#ffffff;--c1:#1c71d8;--c2:#e66100;--c3:#26a269;--c4:#9141ac;--shadow:#00000022; font-family: "Adwaita Sans", Inter, Cantarell, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { .sqa { --win:#27272b;--bar:#34343a;--side:#2e2e33;--line:#4a4a52;--fg:#f1f1f3;--dim:#a3a3ad;--accent:#78aeed;--accent-soft:#78aeed2e;--on-accent:#14141a;--c1:#78aeed;--c2:#ffa348;--c3:#57e389;--c4:#dc8add;--shadow:#00000066; } }
.sqa text { fill: var(--fg); font-size: 12px; }
.sqa .dim { fill: var(--dim); }
.sqa .small { font-size: 10.5px; }
.sqa .title { font-weight: 700; font-size: 12.5px; }
.sqa .step text { font-size: 12.5px; font-weight: 600; }
.sqa .a { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.sqa .trace { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; vector-effect: non-scaling-stroke; }
/* A plain curve, for groups the animation stretches or cross-fades: the dash trick misbehaves there. */
.sqa .curve { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sqa .ring { transform-box: fill-box; transform-origin: center; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .sqa .a { animation: none; } }

/* Resting state = the result: the Products pane open and the product plotted. */
.sqa .cursor { animation-name: sqa-cursor; opacity: 0; }
.sqa .ghost { animation-name: sqa-ghost; opacity: 0; }
.sqa .rowhot { animation-name: sqa-rowhot; opacity: 0; }
.sqa .dzhot { animation-name: sqa-dzhot; opacity: 0; }
.sqa .hint { animation-name: sqa-hint; opacity: 0; }
.sqa .plot { animation-name: sqa-plot; }
.sqa .pane { animation-name: sqa-pane; }
.sqa .tabhot { animation-name: sqa-tab; }
.sqa .open { animation-name: sqa-open; }
.sqa .press { animation-name: sqa-press; }
.sqa .release { animation-name: sqa-release; }
.sqa .s1 { animation-name: sqa-s1; }
.sqa .s2 { animation-name: sqa-s2; }
.sqa .s3 { animation-name: sqa-s3; }
.sqa .t0 { animation-name: sqa-t0; }
.sqa .t1 { animation-name: sqa-t1; }
.sqa .t2 { animation-name: sqa-t2; }
