<svg class="sqc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Open the Catalogs pane from the left edge and drag a catalog onto a panel: its events are drawn as coloured spans across the plots.">
<style>
.sqc { --win:#ffffff;--bar:#ebebed;--side:#f4f4f6;--line:#d5d5da;--fg:#2f2f33;--dim:#77777f;--accent:#3584e4;--accent-soft:#3584e422;--on-accent:#ffffff;--c1:#1c71d8;--c2:#e66100;--c3:#26a269;--c4:#9141ac;--shadow:#00000022; font-family: "Adwaita Sans", Inter, Cantarell, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { .sqc { --win:#27272b;--bar:#34343a;--side:#2e2e33;--line:#4a4a52;--fg:#f1f1f3;--dim:#a3a3ad;--accent:#78aeed;--accent-soft:#78aeed2e;--on-accent:#14141a;--c1:#78aeed;--c2:#ffa348;--c3:#57e389;--c4:#dc8add;--shadow:#00000066; } }
.sqc text { fill: var(--fg); font-size: 12px; }
.sqc .dim { fill: var(--dim); }
.sqc .small { font-size: 10.5px; }
.sqc .title { font-weight: 700; font-size: 12.5px; }
.sqc .step text { font-size: 12.5px; font-weight: 600; }
.sqc .a { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.sqc .trace { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; vector-effect: non-scaling-stroke; }
/* A plain curve, for groups the animation stretches or cross-fades: the dash trick misbehaves there. */
.sqc .curve { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sqc .ring { transform-box: fill-box; transform-origin: center; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .sqc .a { animation: none; } }

/* Resting state = the result: the Catalogs pane open and the events drawn on the panel. */
.sqc .cursor { animation-name: sqc-cursor; opacity: 0; }
.sqc .ghost { animation-name: sqc-ghost; opacity: 0; }
.sqc .rowhot { animation-name: sqc-rowhot; opacity: 0; }
.sqc .dzhot { animation-name: sqc-dzhot; opacity: 0; }
.sqc .pane { animation-name: sqc-pane; }
.sqc .tabhot { animation-name: sqc-tab; }
.sqc .open { animation-name: sqc-open; } .sqc .press { animation-name: sqc-press; } .sqc .release { animation-name: sqc-release; }
.sqc .s1 { animation-name: sqc-s1; } .sqc .s2 { animation-name: sqc-s2; } .sqc .s3 { animation-name: sqc-s3; }
.sqc .ev0 { animation-name: sqc-ev0; }
.sqc .ev1 { animation-name: sqc-ev1; }
.sqc .ev2 { animation-name: sqc-ev2; }
@keyframes sqc-cursor { 0.00% { transform: translate(575px, 318px);opacity: 1; } 5.00% { transform: translate(575px, 318px);opacity: 1; } 15.83% { transform: translate(35px, 104px);opacity: 1; } 22.50% { transform: translate(35px, 104px);opacity: 1; } 33.33% { transform: translate(150px, 133px);opacity: 1; } 40.00% { transform: translate(150px, 133px);opacity: 1; } 59.17% { transform: translate(470px, 205px);opacity: 1; } 90.00% { transform: translate(470px, 205px);opacity: 1; } 100.00% { transform: translate(575px, 318px);opacity: 1; } }
@keyframes sqc-ghost { 0.00% { transform: translate(150px, 133px);opacity: 0; } 39.17% { transform: translate(150px, 133px);opacity: 0; } 40.00% { transform: translate(150px, 133px);opacity: 1; } 59.17% { transform: translate(470px, 205px);opacity: 1; } 60.83% { transform: translate(470px, 205px);opacity: 1; } 63.33% { transform: translate(470px, 205px);opacity: 0; } 100.00% { transform: translate(470px, 205px);opacity: 0; } }
@keyframes sqc-pane { 0.00% { transform: translate(-28px, 0px); opacity: 0; } 18.33% { transform: translate(-28px, 0px); opacity: 0; } 24.17% { transform: translate(0px, 0px); opacity: 1; } 95.00% { transform: translate(0px, 0px); opacity: 1; } 99.17% { transform: translate(-28px, 0px); opacity: 0; } 100.00% { transform: translate(-28px, 0px); opacity: 0; } }
@keyframes sqc-tab { 0.00% { opacity: 0; } 17.50% { opacity: 0; } 20.00% { opacity: 1; } 95.00% { opacity: 1; } 97.50% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqc-rowhot { 0.00% { opacity: 0; } 31.67% { opacity: 0; } 33.75% { opacity: 1; } 60.83% { opacity: 1; } 62.92% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqc-dzhot { 0.00% { opacity: 0; } 48.33% { opacity: 0; } 50.83% { opacity: 1; } 60.83% { opacity: 1; } 63.33% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqc-open { 18.17% { transform: scale(.3); opacity: 0; } 18.33% { transform: scale(.3); opacity: .9; } 23.33% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqc-press { 38.17% { transform: scale(.3); opacity: 0; } 38.33% { transform: scale(.3); opacity: .9; } 43.33% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqc-release { 60.67% { transform: scale(.3); opacity: 0; } 60.83% { transform: scale(.3); opacity: .9; } 65.83% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqc-ev0 { 0.00% { opacity: 0; } 63.33% { opacity: 0; } 67.50% { opacity: 1; } 93.33% { opacity: 1; } 97.50% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqc-ev1 { 0.00% { opacity: 0; } 66.25% { opacity: 0; } 70.42% { opacity: 1; } 93.33% { opacity: 1; } 97.50% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqc-ev2 { 0.00% { opacity: 0; } 69.17% { opacity: 0; } 73.33% { opacity: 1; } 93.33% { opacity: 1; } 97.50% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqc-s1 { 0.00% { opacity: .4; } 4.17% { opacity: .4; } 6.67% { opacity: 1; } 26.67% { opacity: 1; } 29.17% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqc-s2 { 0.00% { opacity: .4; } 29.17% { opacity: .4; } 31.67% { opacity: 1; } 60.83% { opacity: 1; } 63.33% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqc-s3 { 0.00% { opacity: .4; } 63.33% { opacity: .4; } 65.83% { opacity: 1; } 92.50% { opacity: 1; } 95.00% { opacity: .4; } 100.00% { opacity: .4; } }
</style>
