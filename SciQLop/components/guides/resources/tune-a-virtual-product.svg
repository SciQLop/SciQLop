<svg class="sqt" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Open the Properties pane from the left edge and pick a virtual product's curve: its keyword arguments are listed under Adjustable inputs. Change one and the curve is computed again.">
<style>
.sqt { --win:#ffffff;--bar:#ebebed;--side:#f4f4f6;--line:#d5d5da;--fg:#2f2f33;--dim:#77777f;--accent:#3584e4;--accent-soft:#3584e422;--on-accent:#ffffff;--c1:#1c71d8;--c2:#e66100;--c3:#26a269;--c4:#9141ac;--shadow:#00000022; font-family: "Adwaita Sans", Inter, Cantarell, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { .sqt { --win:#27272b;--bar:#34343a;--side:#2e2e33;--line:#4a4a52;--fg:#f1f1f3;--dim:#a3a3ad;--accent:#78aeed;--accent-soft:#78aeed2e;--on-accent:#14141a;--c1:#78aeed;--c2:#ffa348;--c3:#57e389;--c4:#dc8add;--shadow:#00000066; } }
.sqt text { fill: var(--fg); font-size: 12px; }
.sqt .dim { fill: var(--dim); }
.sqt .small { font-size: 10.5px; }
.sqt .title { font-weight: 700; font-size: 12.5px; }
.sqt .step text { font-size: 12.5px; font-weight: 600; }
.sqt .a { animation-duration: 13s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.sqt .trace { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; vector-effect: non-scaling-stroke; }
/* A plain curve, for groups the animation stretches or cross-fades: the dash trick misbehaves there. */
.sqt .curve { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sqt .ring { transform-box: fill-box; transform-origin: center; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .sqt .a { animation: none; } }

/* Resting state = the result: the curve picked, its frequency raised, the curve redrawn. */
.sqt .cursor { animation-name: sqt-cursor; opacity: 0; }
.sqt .pane { animation-name: sqt-pane; }
.sqt .tabhot { animation-name: sqt-tab; }
.sqt .picked { animation-name: sqt-picked; }
.sqt .inputs { animation-name: sqt-inputs; }
.sqt .before { animation-name: sqt-before; opacity: 0; }
.sqt .after { animation-name: sqt-after; }
.sqt .old { animation-name: sqt-old; opacity: 0; }
.sqt .new { animation-name: sqt-new; }
.sqt .open { animation-name: sqt-open; }
.sqt .pick { animation-name: sqt-pick; }
.sqt .step { animation-name: sqt-step; }
.sqt .s1 { animation-name: sqt-s1; }
.sqt .s2 { animation-name: sqt-s2; }
.sqt .s3 { animation-name: sqt-s3; }
@keyframes sqt-cursor { 0.00% { transform: translate(600px, 300px);opacity: 1; } 4.62% { transform: translate(600px, 300px);opacity: 1; } 11.54% { transform: translate(35px, 157px);opacity: 1; } 18.46% { transform: translate(35px, 157px);opacity: 1; } 25.38% { transform: translate(132px, 131px);opacity: 1; } 32.31% { transform: translate(132px, 131px);opacity: 1; } 39.23% { transform: translate(226px, 244px);opacity: 1; } 87.69% { transform: translate(226px, 244px);opacity: 1; } 100.00% { transform: translate(600px, 300px);opacity: 1; } }
@keyframes sqt-pane { 0.00% { transform: translate(-28px, 0px); opacity: 0; } 13.85% { transform: translate(-28px, 0px); opacity: 0; } 19.23% { transform: translate(0px, 0px); opacity: 1; } 93.85% { transform: translate(0px, 0px); opacity: 1; } 97.69% { transform: translate(-28px, 0px); opacity: 0; } 100.00% { transform: translate(-28px, 0px); opacity: 0; } }
@keyframes sqt-tab { 0.00% { opacity: 0; } 13.08% { opacity: 0; } 15.38% { opacity: 1; } 93.85% { opacity: 1; } 96.15% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqt-picked { 0.00% { opacity: 0; } 27.69% { opacity: 0; } 28.85% { opacity: 1; } 93.85% { opacity: 1; } 95.00% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqt-inputs { 0.00% { opacity: 0; } 29.23% { opacity: 0; } 31.54% { opacity: 1; } 93.85% { opacity: 1; } 96.15% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqt-before { 0.00% { opacity: 1; } 41.54% { opacity: 1; } 42.31% { opacity: 0; } 93.85% { opacity: 0; } 94.62% { opacity: 1; } 100.00% { opacity: 1; } }
@keyframes sqt-after { 0.00% { opacity: 0; } 41.54% { opacity: 0; } 42.31% { opacity: 1; } 93.85% { opacity: 1; } 94.62% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqt-old { 0.00% { opacity: 1; } 45.38% { opacity: 1; } 50.00% { opacity: 0; } 96.15% { opacity: 0; } 100.00% { opacity: 1; } 100.00% { opacity: 1; } }
@keyframes sqt-new { 0.00% { opacity: 0; } 45.38% { opacity: 0; } 50.00% { opacity: 1; } 93.85% { opacity: 1; } 98.46% { opacity: 0; } 100.00% { opacity: 0; } }
@keyframes sqt-open { 13.69% { transform: scale(.3); opacity: 0; } 13.85% { transform: scale(.3); opacity: .9; } 18.46% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqt-pick { 27.54% { transform: scale(.3); opacity: 0; } 27.69% { transform: scale(.3); opacity: .9; } 32.31% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqt-step { 41.38% { transform: scale(.3); opacity: 0; } 41.54% { transform: scale(.3); opacity: .9; } 46.15% { transform: scale(1.5); opacity: 0; } 100.00% { transform: scale(1.5); opacity: 0; } }
@keyframes sqt-s1 { 0.00% { opacity: .4; } 3.85% { opacity: .4; } 6.15% { opacity: 1; } 21.54% { opacity: 1; } 23.85% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqt-s2 { 0.00% { opacity: .4; } 23.08% { opacity: .4; } 25.38% { opacity: 1; } 35.38% { opacity: 1; } 37.69% { opacity: .4; } 100.00% { opacity: .4; } }
@keyframes sqt-s3 { 0.00% { opacity: .4; } 36.92% { opacity: .4; } 39.23% { opacity: 1; } 91.54% { opacity: 1; } 93.85% { opacity: .4; } 100.00% { opacity: .4; } }
</style>
