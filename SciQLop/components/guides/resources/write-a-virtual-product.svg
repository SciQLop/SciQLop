<svg class="sqv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Run a notebook cell that starts with %%vp: its function becomes a product in the Products pane, under its own name. Drag it onto a panel to plot it.">
<style>
.sqv { --win:#ffffff;--bar:#ebebed;--side:#f4f4f6;--line:#d5d5da;--fg:#2f2f33;--dim:#77777f;--accent:#3584e4;--accent-soft:#3584e422;--on-accent:#ffffff;--c1:#1c71d8;--c2:#e66100;--c3:#26a269;--c4:#9141ac;--shadow:#00000022; font-family: "Adwaita Sans", Inter, Cantarell, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { .sqv { --win:#27272b;--bar:#34343a;--side:#2e2e33;--line:#4a4a52;--fg:#f1f1f3;--dim:#a3a3ad;--accent:#78aeed;--accent-soft:#78aeed2e;--on-accent:#14141a;--c1:#78aeed;--c2:#ffa348;--c3:#57e389;--c4:#dc8add;--shadow:#00000066; } }
.sqv text { fill: var(--fg); font-size: 12px; }
.sqv .dim { fill: var(--dim); }
.sqv .small { font-size: 10.5px; }
.sqv .title { font-weight: 700; font-size: 12.5px; }
.sqv .step text { font-size: 12.5px; font-weight: 600; }
.sqv .a { animation-duration: 13s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.sqv .trace { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; vector-effect: non-scaling-stroke; }
/* A plain curve, for groups the animation stretches or cross-fades: the dash trick misbehaves there. */
.sqv .curve { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sqv .ring { transform-box: fill-box; transform-origin: center; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .sqv .a { animation: none; } }

/* Resting state = the result: the cell has run, the product is in the tree and plotted. */
.sqv .code text { font-family: monospace; font-size: 10.5px; }
.sqv .cursor { animation-name: sqv-cursor; opacity: 0; }
.sqv .ghost { animation-name: sqv-ghost; opacity: 0; }
.sqv .pane { animation-name: sqv-pane; }
.sqv .tabhot { animation-name: sqv-tab; }
.sqv .newrow { animation-name: sqv-newrow; }
.sqv .rowhot { animation-name: sqv-rowhot; opacity: 0; }
.sqv .dzhot { animation-name: sqv-dzhot; opacity: 0; }
.sqv .empty { animation-name: sqv-empty; opacity: 0; }
.sqv .unrun { animation-name: sqv-unrun; opacity: 0; }
.sqv .ran { animation-name: sqv-ran; }
.sqv .key { animation-name: sqv-key; opacity: 0; }
.sqv .sine { animation-name: sqv-sine; }
.sqv .run { animation-name: sqv-run; }
.sqv .open { animation-name: sqv-open; }
.sqv .press { animation-name: sqv-press; }
.sqv .release { animation-name: sqv-release; }
.sqv .s1 { animation-name: sqv-s1; }
.sqv .s2 { animation-name: sqv-s2; }
.sqv .s3 { animation-name: sqv-s3; }
