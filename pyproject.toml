[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["SciQLop"]

[project]
name = "SciQLop"
version = "0.13.0.dev0"
description = "An ergonomic and efficient application to browse and label in situ plasma measurements from multi-mission satellite data."
keywords = ["machine-learning", "satellite", "plasma-physics", "nasa-data", "amda", "cdpp"]
authors = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]

maintainers = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]

requires-python = ">=3.11,<3.15"
license = { file = "COPYING" }
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "SciQLopPlots==0.34.0",
    "cloudpickle",
    "defusedxml",
    "speasy>=1.6.1",
    "qtconsole",
    "humanize",
    "platformdirs",
    "seaborn",
    "scipy",
    "pyside6==6.11.1",
    "shiboken6==6.11.1",
    "PySide6-QtAds==5.0.0.2",
    "ipython",
    "ipywidgets",
    "jupyterlab_widgets",
    # >=0.6.3: earlier versions call IPython's run_cell_async without
    # transformed_cell, a hard TypeError since IPython 9.16 — every notebook
    # execute request then fails silently.
    # >=0.6.4: relaunches a JupyterLab server that Lab's own File > Shut Down
    # killed, and reloads the view only when it isn't already on a Lab page.
    # open_jupyterlab_widget() re-requests the widget on every open and would
    # discard a live Lab's state on 0.6.3, which reloaded unconditionally.
    "jupyqt>=0.6.4",
    "matplotlib==3.11.1",
    "qasync",
    "jinja2",
    "pyzstd",
    "PyGitHub",
    "numpy",
    "expression",
    "pydantic",
    "keyring",
    "pypdf",
    "uv",
    "tomli_w",
    "pyyaml",
    "psutil",
    "model2vec",
    "huggingface_hub"
]
[project.urls]
homepage = "https://github.com/SciQLop/SciQLop"
bug_tracker = "https://github.com/SciQLop/SciQLop/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "hypothesis",
    'pytest-xvfb; platform_system == "Linux"',
    # tscat / tscat_gui are runtime plugin deps (declared in
    # SciQLop/plugins/tscat_catalogs/plugin.json) installed by the workspace
    # launcher in production. CI doesn't take that path, but the test suite's
    # conftest preloads tscat to dodge a known thread race — so it must be
    # available at test time.
    "tscat>=0.5.1",
    "tscat_gui>=0.7.0",
    "pytest-xdist>=3.8.0",
    # runtime deps of the ACP layer (SciQLop/components/agents/acp), declared
    # for end users by the plugins that consume the layer; needed here so its
    # tests can run.
    "agent-client-protocol>=0.12.0",
    # >=1.19.0: earlier versions have no branch for a `CallToolResult` returned
    # by a low-level call_tool handler (the shape claude-agent-sdk's in-process
    # server produces). Being a pydantic model it satisfies `hasattr(__iter__)`,
    # so the server does `content=list(result)` and ships the model's
    # (field, value) tuples — every tool result then fails client-side
    # validation. See tests/test_mcp_calltoolresult_passthrough.py.
    # <2: mcp 2.0 dropped the low-level `Server.list_tools()` / `call_tool()`
    # decorators the ACP tool server is built on.
    "mcp>=1.19.0,<2",
    "uvicorn>=0.30.0",
]

[project.gui-scripts]
sciqlop = "SciQLop.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
xvfb_width = 2560
xvfb_height = 1440
xvfb_xauth = true

[tool.bumpversion]
current_version = "0.13.0.dev0"
commit = true
tag = false
allow_dirty = false
message = "Bump version: {current_version} → {new_version}"
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
# PEP 440 dev-release scheme. The optional `.dev<N>` suffix marks unreleased
# development builds; bumping the `release` part to its optional value drops
# the suffix and produces a final release.
parse = """(?x)
    (?P<major>\\d+)\\.
    (?P<minor>\\d+)\\.
    (?P<patch>\\d+)
    (?:
        \\.(?P<release>dev)
        (?P<build>\\d+)
    )?
"""
serialize = [
    "{major}.{minor}.{patch}.{release}{build}",
    "{major}.{minor}.{patch}",
]

# Workflow:
#   - Right after releasing 0.11.2, run:
#       bump-my-version bump minor   # → 0.12.0.dev0 (commit, no tag)
#   - Iterate during development:
#       bump-my-version bump build   # → 0.12.0.dev1, .dev2, ...
#   - At release time:
#       bump-my-version bump release          # → 0.12.0 (commit)
#       git tag -a v0.12.0 -m "Release v0.12.0"
#       git push jeandet main v0.12.0
#   `tag = false` globally so iterative dev bumps don't accidentally create
#   throwaway tags; release tags are created manually (one extra command, but
#   unambiguous).

[tool.bumpversion.parts.release]
values = ["dev", "final"]
optional_value = "final"

[tool.bumpversion.parts.build]
first_value = "0"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
